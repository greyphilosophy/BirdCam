name: Apply centered rotated preview patch

on:
  push:
    branches:
      - agent/rotate-centered-preview

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/rotate-centered-preview
          fetch-depth: 0

      - name: Apply application patch
        run: python scripts/apply_preview_patch.py

      - name: Commit patched application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Rotate and center debug preview"
          git push origin HEAD:agent/rotate-centered-preview
