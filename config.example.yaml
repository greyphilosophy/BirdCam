# BirdCam Configuration Example
# Copy this to config.yaml and edit for your setup.

camera:
  device: 0
  width: 3840
  height: 2160
  fps: 60
  fourcc: MJPG          # Required for 4K60 on the ELP IMX678 USB camera

detector:
  model_path: models/yolov8n.pt
  conf_thresh: 0.45
  imgsz: 1280           # YOLO inference size; lower this if detection limits FPS
  device: 0             # CUDA device index
  interval_frames: 1    # Run detection every frame; increase to reduce GPU load

tracker:
  padding: 200
  hold_seconds: 1.0     # Time-based so behavior is independent of frame rate
  smoothing: 0.2

debug:
  window: true
  log_fps: true

stream:
  rtmp_url: "rtmp://live.cdn.tiktok.com/live/STREAM_KEY"
  fps: 60
  bitrate: "8000k"
  encoder: h264_nvenc   # Use libx264 if FFmpeg lacks NVIDIA NVENC support
  preset: p4            # For libx264, use a preset such as veryfast
