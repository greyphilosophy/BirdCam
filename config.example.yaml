# BirdCam Configuration Example
# Copy this to config.yaml and edit for your setup.

camera:
  device: 0
  backend: auto          # Windows auto selects MSMF; alternatives: msmf, dshow, any
  width: 3840
  height: 2160
  fps: 60
  fourcc: MJPG           # MSMF may not report the underlying compressed FourCC
  rotation_degrees: 90   # Rotate captured frames clockwise before detection and streaming

detector:
  model_path: models/yolov8n.pt
  conf_thresh: 0.45
  imgsz: 1280           # Guidance resolution, independent of output frame rate
  device: 0             # CUDA device index
  max_fps: 5            # Guidance may run slowly; only the newest frame is sampled

tracker:
  padding: 200
  hold_seconds: 1.0     # Keep the last bird framing briefly after detection disappears
  max_zoom_fraction_per_second: 0.35  # Limit crop-size change to 35%/second
  max_pan_fraction_per_second: 0.25   # Limit center movement to 25% of frame/second
  target_smoothing:
    enabled: true
    center_alpha: 0.30           # Follow 30% of meaningful center movement per detection
    size_alpha: 0.12             # Follow 12% of meaningful crop-size change per detection
    pan_dead_zone_pixels: 30     # Ignore smaller detector-box center fluctuations
    zoom_dead_zone_fraction: 0.04 # Ignore crop-size changes below 4%
    immediate_on_acquire: true   # Accept the first/new-bird target without smoothing delay

idle_view:
  enabled: true
  delay_seconds: 3.0    # After this long without birds, show the complete rotated frame

debug:
  window: true
  log_fps: true
  preview_rotation: none       # Source rotation already makes the stream upright
  preview_width: 720           # Portrait preview window for the 1080x1920 stream canvas
  preview_height: 1280

# Publish BirdCam's finished 1080x1920 BGR frames directly as a webcam device.
# On Windows, install the OBS Virtual Camera driver, but OBS itself does not
# need to be running. Streaming and virtual-camera output may run together.
virtual_camera:
  enabled: false
  backend: obs           # pyvirtualcam backend; "obs" on Windows
  device: null           # Optional exact virtual-camera device name

# The ELP camera has no microphone. Enable this only for a separate Windows
# USB microphone. Find its exact DirectShow name with:
# ffmpeg -list_devices true -f dshow -i dummy
audio:
  enabled: false
  device: "Microphone (USB Audio Device)"
  bitrate: "160k"

stream:
  rtmp_url: "rtmp://live.cdn.tiktok.com/live/STREAM_KEY"
  fps: 60
  bitrate: "8000k"
  encoder: h264_nvenc   # Use libx264 if FFmpeg lacks NVIDIA NVENC support
  preset: p4            # For libx264, use a preset such as veryfast
